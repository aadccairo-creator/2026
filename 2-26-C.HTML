<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل البطاقات الرياضية التفاعلي - 60 بطاقة</title>
  <style>
    :root {
      --primary: #1a237e;
      --secondary: #2e7d32;
      --accent: #ffa000;
      --bg: #f4f7fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }
    
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: all 0.2s ease; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 1250px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 20px; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 26px; }
    p.subtitle { color: #666; margin: 0; font-size: 14px; }

    /* شريط الأدوات والفلترة */
    .toolbar { background: #fff; padding: 18px 24px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .search-box { flex: 1; min-width: 260px; }
    .search-box input { width: 100%; padding: 12px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; }
    .search-box input:focus { border-color: var(--primary); }
    
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-group select, .btn-random { padding: 11px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; background: #fff; cursor: pointer; font-weight: bold; }
    .btn-random { background: #fff3e0; color: #e65100; border-color: #ffe0b2; }
    .btn-random:hover { background: #ffe0b2; }
    
    .counter-badge { background: #e8eaf6; color: var(--primary); font-weight: bold; padding: 8px 16px; border-radius: 20px; font-size: 13px; }

    /* شبكة البطاقات */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 22px; }
    
    /* تصميم البطاقة التفاعلية */
    .sports-card { background: var(--card-bg); border-radius: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); padding: 22px; border-top: 6px solid var(--secondary); display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative; }
    .sports-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .badge-cat { background: #e8f5e9; color: var(--secondary); }
    .badge-level { background: #e3f2fd; color: #1565c0; }
    
    .sports-card h3 { margin: 8px 0 12px 0; color: var(--primary); font-size: 18px; line-height: 1.3; }
    
    /* تبويبات التفاعل داخل البطاقة */
    .card-tabs { display: flex; border-bottom: 2px solid #f0f0f0; margin-bottom: 12px; gap: 8px; }
    .tab-btn { background: none; border: none; padding: 6px 10px; font-size: 12px; font-weight: bold; color: #888; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    
    .tab-content { display: none; font-size: 13px; line-height: 1.6; color: #444; min-height: 100px; }
    .tab-content.active { display: block; }
    
    .click-hint { font-size: 11px; color: var(--secondary); text-align: center; margin-top: 15px; font-weight: bold; background: #f1f8e9; padding: 8px; border-radius: 6px; }

    /* النافذة المنبثقة Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; border-radius: 16px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .close-modal { position: absolute; top: 20px; left: 20px; font-size: 22px; cursor: pointer; color: #888; border: none; background: #f0f0f0; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .close-modal:hover { background: #e0e0e0; color: #000; }
    
    .modal-header { border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 20px; }
    .modal-header h2 { color: var(--primary); margin: 10px 0 5px 0; font-size: 22px; }
    .modal-section { margin-bottom: 18px; }
    .modal-section h4 { color: var(--secondary); margin: 0 0 6px 0; font-size: 15px; border-right: 4px solid var(--secondary); padding-right: 8px; }
    .modal-step-box { background: #fff8e1; border-right: 4px solid var(--accent); padding: 15px; border-radius: 8px; margin-top: 15px; }
    .modal-step-box p { margin: 6px 0; font-size: 13px; }
  </style>
</head>

    function renderCards(cards) {
      const grid = document.getElementById('cardsGrid');
      const counter = document.getElementById('cardCounter');
      grid.innerHTML = '';
      counter.textContent = `عرض: ${cards.length} / ${cardsData.length}`;

      if(cards.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; background: #fff; border-radius: 12px; color: #777;">لا توجد بطاقات مطابقة لنتائج البحث.</div>';
        return;
      }

      cards.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'sports-card';
        
        cardEl.innerHTML = `
          <div>
            <div class="card-top">
              <span class="badge badge-cat">${card.category}</span>
              <span class="badge badge-level">${card.level}</span>
            </div>
            <h3>${card.title_ar}</h3>
            
            <div class="card-tabs" onclick="event.stopPropagation()">
              <button class="tab-btn active" onclick="switchTab(event, 'obj-${card.id}')">الهدف</button>
              <button class="tab-btn" onclick="switchTab(event, 'skills-${card.id}')">المهارات</button>
              <button class="tab-btn" onclick="switchTab(event, 'step-${card.id}')">نموذج STEP</button>
            </div>

            <div id="obj-${card.id}" class="tab-content active">
              <p><strong>الهدف:</strong> ${card.objective}</p>
              <p><strong>الأدوات:</strong> ${card.equipment}</p>
            </div>
            
            <div id="skills-${card.id}" class="tab-content">
              <p><strong>المهارات الحركية:</strong> ${card.skills}</p>
              <p><strong>القيم التربوية:</strong> ${card.values}</p>
            </div>

            <div id="step-${card.id}" class="tab-content">
              <p><strong>المكان:</strong> ${card.step_space}</p>
              <p><strong>المهام:</strong> ${card.step_task}</p>
            </div>
          </div>
          
          <div class="click-hint" onclick="openModal(${card.id})">🔍 اضغط هنا للتفاصيل الشاملة</div>
        `;

        cardEl.addEventListener('click', (e) => {
          if(!e.target.classList.contains('tab-btn')) {
            openModal(card.id);
          }
        });

        grid.appendChild(cardEl);
      });
    }

    function switchTab(e, tabId) {
      e.stopPropagation();
      const card = e.target.closest('.sports-card');
      card.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      card.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      e.target.classList.add('active');
      card.querySelector(`#${tabId}`).classList.add('active');
    }

    function openModal(id) {
      const card = cardsData.find(c => c.id === id);
      if(!card) return;

      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <div class="modal-header">
          <span class="badge badge-cat">${card.category}</span>
          <span class="badge badge-level">${card.level}</span>
          <h2>${card.title_ar}</h2>
        </div>
        
        <div class="modal-section">
          <h4>🎯 الهدف الرئيسي والوصف</h4>
          <p>${card.objective}</p>
        </div>

        <div class="modal-section">
          <h4>🎽 المهارات والأدوات والقيم</h4>
          <p><strong>المهارات الحركية:</strong> ${card.skills}</p>
          <p><strong>القيم التربوية:</strong> ${card.values}</p>
          <p><strong>الأدوات المطلوبة:</strong> ${card.equipment}</p>
        </div>

        <div class="modal-step-box">
          <h4 style="color: #e65100; border: none; padding: 0; margin-bottom: 10px;">⚙️ إطار تعديل النشاط (نموذج STEP):</h4>
          <p><strong>📍 المكان (Space):</strong> ${card.step_space}</p>
          <p><strong>📋 المهام (Task):</strong> ${card.step_task}</p>
          <p><strong>🎒 الأدوات (Equipment):</strong> ${card.step_equipment}</p>
          <p><strong>👥 الأفراد (People):</strong> ${card.step_people}</p>
        </div>
      `;

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if(e.target.id === 'modalOverlay') closeModal();
    });

    document.getElementById('searchInput').addEventListener('input', filterCards);
    document.getElementById('catSelect').addEventListener('change', filterCards);
    document.getElementById('levelSelect').addEventListener('change', filterCards);

    function filterCards() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const cat = document.getElementById('catSelect').value;
      const lvl = document.getElementById('levelSelect').value;

      const filtered = cardsData.filter(c => {
        const matchesQ = !q || c.title_ar.toLowerCase().includes(q) || 
                               c.skills.toLowerCase().includes(q) || 
                               c.objective.toLowerCase().includes(q) ||
                               c.equipment.toLowerCase().includes(q);
        const matchesCat = !cat || c.category.includes(cat);
        const matchesLvl = !lvl || c.level.includes(lvl);
        return matchesQ && matchesCat && matchesLvl;
      });

      renderCards(filtered);
    }

    function pickRandomCard() {
      if(cardsData.length === 0) return;
      const randomCard = cardsData[Math.floor(Math.random() * cardsData.length)];
      openModal(randomCard.id);
    }

    // عرض البطاقات الـ 60 فور فتح الصفحة
    renderCards(cardsData);
  </script>
</body>
</html>
