<!-- بداية تطبيق بطاقات الاستذكار التفاعلي للموقع -->
<div id="studio-flashcards-app" dir="rtl">
  <style>
    #studio-flashcards-app {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 25px auto;
      padding: 25px;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.1);
      color: #212529;
    }

    .app-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .app-header h2 {
      font-size: 26px;
      color: #111827;
      margin-bottom: 6px;
    }
    .app-header p {
      font-size: 14px;
      color: #6b7280;
      margin: 0;
    }

    /* Controls Bar */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 10px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #2563eb;
    }

    .view-toggle-btns, .filter-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-tab {
      padding: 8px 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #374151;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-tab.active, .btn-tab:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* Progress Bar */
    .progress-container {
      margin-bottom: 15px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      height: 8px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.3s ease;
    }

    /* Single Card (3D Flip Deck) */
    .deck-view {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .flashcard-3d {
      width: 100%;
      max-width: 650px;
      height: 320px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .flashcard-3d.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border: 2px solid #e5e7eb;
    }
    .card-front {
      color: #111827;
    }
    .card-back {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
      transform: rotateY(180deg);
    }
    .card-category-badge {
      position: absolute;
      top: 15px;
      right: 20px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #bfdbfe;
    }
    .card-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.6;
    }
    .card-hint-text {
      position: absolute;
      bottom: 15px;
      font-size: 12px;
      color: #9ca3af;
    }

    /* Deck Nav Buttons */
    .deck-nav-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn-nav {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-nav:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
    .btn-nav-secondary {
      background: #6b7280;
    }
    .btn-nav-secondary:hover {
      background: #4b5563;
    }

    /* Grid View */
    .grid-view {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .grid-card {
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .grid-card:hover {
      border-color: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(37,99,235,0.1);
    }
    .grid-card-q {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1f2937;
    }
    .grid-card-a {
      display: none;
      font-size: 13px;
      color: #166534;
      background: #f0fdf4;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      line-height: 1.5;
    }
    .grid-card.open .grid-card-a {
      display: block;
    }
  </style>

  <div class="app-header">
    <h2>بطاقات استذكار ألعاب القوى 🏃‍♂️</h2>
    <p>30 بطاقة شاملة للأسس الفسيولوجية، التكنيك، الموانع، المشي، وتخطيط الأحمال</p>
  </div>

  <div class="controls-row">
    <input type="text" id="appSearch" class="search-input" placeholder="ابحث في الأسئلة والإجابات..." onkeyup="onSearchOrFilter()">
    <div class="view-toggle-btns">
      <button class="btn-tab active" id="btnModeDeck" onclick="switchViewMode('deck')">🎴 بطاقة ببطاقة</button>
      <button class="btn-tab" id="btnModeGrid" onclick="switchViewMode('grid')">📱 عرض الكل (شبكة)</button>
    </div>
  </div>

  <div class="controls-row">
    <div class="filter-btns" id="filterBtns">
      <button class="btn-tab active" onclick="setCategory('all', this)">الكل (30)</button>
      <button class="btn-tab" onclick="setCategory('الفسيولوجيا', this)">الفسيولوجيا</button>
      <button class="btn-tab" onclick="setCategory('التكنيك', this)">التكنيك</button>
      <button class="btn-tab" onclick="setCategory('الموانع', this)">الموانع</button>
      <button class="btn-tab" onclick="setCategory('المشي', this)">المشي</button>
      <button class="btn-tab" onclick="setCategory('التخطيط', this)">التخطيط</button>
    </div>
  </div>

  <!-- Deck Mode -->
  <div id="deckMode" class="deck-view">
    <div class="progress-container" style="width: 100%; max-width: 650px;">
      <div class="progress-info">
        <span id="deckProgressText">البطاقة 1 من 30</span>
        <span id="deckCategoryText">القسم: الفسيولوجيا</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="deckProgressBar"></div>
      </div>
    </div>

    <div class="flashcard-3d" id="mainCard" onclick="toggleCardFlip()">
      <div class="card-inner">
        <div class="card-front">
          <span class="card-category-badge" id="cardCatBadge">الفسيولوجيا</span>
          <div class="card-text" id="cardQuestionText">السؤال هنا...</div>
          <div class="card-hint-text">💡 اضغط على البطاقة لإظهار الإجابة</div>
        </div>
        <div class="card-back">
          <div class="card-text" id="cardAnswerText">الإجابة هنا...</div>
          <div class="card-hint-text">🔄 اضغط مرة أخرى لإخفاء الإجابة</div>
        </div>
      </div>
    </div>

    <div class="deck-nav-btns">
      <button class="btn-nav btn-nav-secondary" onclick="prevCard()">السابق ⬅️</button>
      <button class="btn-nav" onclick="toggleCardFlip()">اقلب البطاقة 🔄</button>
      <button class="btn-nav btn-nav-secondary" onclick="shuffleCards()">عشوائي 🔀</button>
      <button class="btn-nav" onclick="nextCard()">التالي ➡️</button>
    </div>
  </div>

  <!-- Grid Mode -->
  <div id="gridMode" class="grid-view"></div>
</div>

<script>
  const cardsDatabase = [
    { q: "1. ما هو التعريف العلمي للحد الأقصى لاستهلاك الأكسجين (VO2max)؟", a: "أعلى معدل يستطيع الجسم من خلاله امتصاص واستخدام الأكسجين أثناء التمارين الشديدة.", cat: "الفسيولوجيا" },
    { q: "2. ما هي العوامل المركزية المؤثرة في VO2max ونسبتها؟", a: "تشكل 75% وتضم سعة الانتشار الرئوي، حجم الضربة (الدفع القلبي)، والقابلية على حمل الأكسجين في الدم.", cat: "الفسيولوجيا" },
    { q: "3. ما هي العوامل الطرفية المؤثرة في VO2max ونسبتها؟", a: "تشكل 25% وتضم مستويات إنزيمات الميتوكوندريا، كثافة الشعيرات الدموية، الميوجلوبين، ونوع ومقطع الألياف العضلية.", cat: "الفسيولوجيا" },
    { q: "4. ما هي الشدة ونسب الطاقة الهوائية واللاهوائية في سباق 800م؟", a: "الشدة 115-130% من VO2max، المساهمة الهوائية 60-70%، واللاهوائية 30-40%.", cat: "الفسيولوجيا" },
    { q: "5. ما هي الشدة ونسب الطاقة الهوائية واللاهوائية في سباق 1500م؟", a: "الشدة 105-115% من VO2max، المساهمة الهوائية 80-85%، واللاهوائية 15-20%.", cat: "الفسيولوجيا" },
    { q: "6. ما هي الشدة ونسب الطاقة الهوائية واللاهوائية في سباق 3000م؟", a: "الشدة 100% من VO2max، المساهمة الهوائية 85-90%، واللاهوائية 10-15%.", cat: "الفسيولوجيا" },
    { q: "7. ما هي الشدة ونسب الطاقة الهوائية واللاهوائية في سباق 5000م؟", a: "الشدة 95-100% من VO2max، المساهمة الهوائية 90-95%، واللاهوائية 5-10%.", cat: "الفسيولوجيا" },
    { q: "8. ما هي الشدة ونسب الطاقة الفسيولوجية في سباق 10000م؟", a: "الشدة 90-95% من VO2max، المساهمة الهوائية 97%، واللاهوائية 3%.", cat: "الفسيولوجيا" },
    { q: "9. ما هي الشدة ونسب الطاقة الفسيولوجية في سباق الماراثون؟", a: "الشدة 75-80% من VO2max، المساهمة الهوائية 99.9%، واللاهوائية 0.1%.", cat: "الفسيولوجيا" },
    { q: "10. ما هي المكونات الثلاثة الرئيسية لطول الخطوة في الجري؟", a: "مسافة هبوط القدم أمام الجسم، مسافة دفع القدم خلف الجسم، ومسافة الطيران في الهواء.", cat: "التكنيك" },
    { q: "11. ما هو خطأ \"الخطو الزائد\" (Overstriding) ولماذا يُحذر منه؟", a: "هبوط القدم بمسافة كبيرة أمام الجسم، مما يزيد من قوى الفرملة المعطلة للحركة ويهدر الطاقة.", cat: "التكنيك" },
    { q: "12. ما هي الوضعية الميكانيكية الصحيحة للجذع أثناء الجري؟", a: "استقرار الجذع والسيطرة عليه طوال السباق يمنع تشتت الطاقة ويضمن أقصى دفع للأمام.", cat: "التكنيك" },
    { q: "13. كيف تكون زاوية الركبة أثناء مرحلة دفع الأرض في المسافات المتوسطة؟", a: "تكون الزاوية أقل من 180 درجة ولا يحدث مد كامل، مما يدل على الدور الأكبر للعمل العضلي الخلفي.", cat: "التكنيك" },
    { q: "14. كيف يتم الامتصاص الصحيح عند هبوط القدم في الجري؟", a: "ضرب الأرض بالكعب مع انثناء سريع، وتوضع القدم أسفل الحوض مباشرة لامتصاص الوزن الكلي.", cat: "التكنيك" },
    { q: "15. ما الأسباب العضلية لخلل انهيار الركبة للداخل (Knee Valgus)؟", a: "ضعف عضلات الكاحل/القدم لامتصاص الصدمة، وضعف عضلات الحوض (خاصة الألية الوسطى).", cat: "التكنيك" },
    { q: "16. ما هو عدد الموانع العادية والمائية في سباق 3000م موانع؟", a: "يواجه العداء 28 مانعاً عادياً و7 موانع مائية طوال مسافة السباق.", cat: "الموانع" },
    { q: "17. ما هي أبعاد وتكنيك المانع المائي في سباق الموانع؟", a: "عرض العارضة 3.66 م وهي ثابته تليها حفرة ماء، ويتطلب الارتقاء الحفاظ على مركز ثقل منخفض.", cat: "الموانع" },
    { q: "18. ما هو خطأ \"أذرع الهليكوبتر\" في سباق الموانع؟", a: "رمي الذراعين للجانبين عند تعدية المانع مما يسبب اختلال التوازن والفعالية البيوميكانيكية.", cat: "الموانع" },
    { q: "19. ما هي القاعدة الأولى لسباق المشي الرياضي (القاعدة 54.2)؟", a: "الاتصال الدائم بالأرض بحيث لا يحدث فقدان مرئي بالعين المجردة للمتسابق.", cat: "المشي" },
    { q: "20. ما هي القاعدة الثانية لسباق المشي الرياضي فيما يخص الركبة؟", a: "استقامة الركبة الأمامية تماماً دون انثناء من لحظة الملامسة الأولى للأرض حتى الوضع العمودي.", cat: "المشي" },
    { q: "21. ما هو الدور الميكانيكي لحركة الحوض في سباق المشي؟", a: "يساعد دوران الحوض حول المحور العمودي في زيادة طول الخطوة والإيقاع ومنع الانثناء.", cat: "المشي" },
    { q: "22. ما هي نسب مكونات طول الخطوة في المشي لرجال النخبة؟", a: "القدم للأمام 33%، القدم خلف الجسم 39%، مسافة الطيران 14%، وحركة القدم 14%.", cat: "المشي" },
    { q: "23. متى يُرفع الكارت الأصفر والأحمر في منافسات المشي؟", a: "الأصفر للتحذير عند الشك في التكنيك، والأحمر يُرسل عند الملاحظة الواضحة لعدم الالتزام بالقواعد.", cat: "المشي" },
    { q: "24. كيف يُصحح خطأ الانحناء الأمامي المفرط في المشي؟", a: "طلب وضع اليدين مشبكتين خلف الفخذين والدفع بقوة لمساعدة العمود الفقري على المحاذاة الصحيحة.", cat: "المشي" },
    { q: "25. ما هي الشدة والهدف في المنطقة الأولى للتدريب (Z1)؟", a: "تكون الشدة تحت العتبة الأولى (< LT1) لتطوير القاعدة الهوائية والاستشفاء ومخاطر إصابة منخفضة.", cat: "التخطيط" },
    { q: "26. ما هي حدود المنطقة الثانية للتدريب (Z2)؟", a: "تقع الشدة بين العتبة الفسيولوجية الأولى والعتبة الثانية (> LT1 و < LT2).", cat: "التخطيط" },
    { q: "27. ما هي الشدة والخطورة في المنطقة الثالثة للتدريب (Z3)؟", a: "تكون فوق العتبة الثانية (> LT2) وذات تأثير كبير على الطاقة الهوائية القصوى ولكن بخطر إصابة أعلى.", cat: "التخطيط" },
    { q: "28. ما المقصود بديناميكية الأحمال (2:1، 3:1، 4:1) في الدورة الصغرى؟", a: "تنظيم أسابيع التدرج في الحمل المرتفع يليه أسبوع استشفاء لتسهيل عمليات التكيف البيولوجي.", cat: "التخطيط" },
    { q: "29. ما الفرق بين الحمل التدريبي الخارجي والحمل الداخلي؟", a: "الخارجي يمثل ما يُطلب كالسرعة والمسافة، بينما الداخلي هو الاستجابة الحيوية كضربات القلب و RPE.", cat: "التخطيط" },
    { q: "30. كيف يُحسب الحمل الداخلي بطريقة فوستر وطريقة Lucia TRIMP؟", a: "فوستر = RPE × دقائق التمرين. طريقة Lucia = (زمن Z1 × 1) + (زمن Z2 × 2) + (زمن Z3 × 3).", cat: "التخطيط" }
  ];

  let currentCategory = 'all';
  let filteredCards = [...cardsDatabase];
  let currentCardIndex = 0;
  let viewMode = 'deck'; // 'deck' or 'grid'

  function initApp() {
    renderDeckCard();
    renderGrid();
  }

  function setCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('#filterBtns .btn-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    onSearchOrFilter();
  }

  function onSearchOrFilter() {
    const query = document.getElementById('appSearch').value.toLowerCase();
    filteredCards = cardsDatabase.filter(card => {
      const matchCat = (currentCategory === 'all' || card.cat === currentCategory);
      const matchText = card.q.toLowerCase().includes(query) || card.a.toLowerCase().includes(query);
      return matchCat && matchText;
    });

    currentCardIndex = 0;
    renderDeckCard();
    renderGrid();
  }

  function renderDeckCard() {
    const mainCard = document.getElementById('mainCard');
    mainCard.classList.remove('flipped');

    if (filteredCards.length === 0) {
      document.getElementById('cardCatBadge').innerText = "-";
      document.getElementById('cardQuestionText').innerText = "لا توجد بطاقات تطابق البحث.";
      document.getElementById('cardAnswerText').innerText = "جرب البحث بكلمات أخرى أو اختر قسماً آخر.";
      document.getElementById('deckProgressText').innerText = "0 من 0";
      document.getElementById('deckProgressBar').style.width = "0%";
      return;
    }

    const card = filteredCards[currentCardIndex];
    document.getElementById('cardCatBadge').innerText = card.cat;
    document.getElementById('cardQuestionText').innerText = card.q;
    document.getElementById('cardAnswerText').innerText = card.a;
    document.getElementById('deckCategoryText').innerText = "القسم: " + card.cat;

    document.getElementById('deckProgressText').innerText = `البطاقة ${currentCardIndex + 1} من ${filteredCards.length}`;
    const percent = ((currentCardIndex + 1) / filteredCards.length) * 100;
    document.getElementById('deckProgressBar').style.width = percent + "%";
  }

  function toggleCardFlip() {
    document.getElementById('mainCard').classList.toggle('flipped');
  }

  function nextCard() {
    if (filteredCards.length === 0) return;
    currentCardIndex = (currentCardIndex + 1) % filteredCards.length;
    renderDeckCard();
  }

  function prevCard() {
    if (filteredCards.length === 0) return;
    currentCardIndex = (currentCardIndex - 1 + filteredCards.length) % filteredCards.length;
    renderDeckCard();
  }

  function shuffleCards() {
    for (let i = filteredCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
    }
    currentCardIndex = 0;
    renderDeckCard();
    renderGrid();
  }

  function switchViewMode(mode) {
    viewMode = mode;
    if (mode === 'deck') {
      document.getElementById('deckMode').style.display = 'flex';
      document.getElementById('gridMode').style.display = 'none';
      document.getElementById('btnModeDeck').classList.add('active');
      document.getElementById('btnModeGrid').classList.remove('active');
    } else {
      document.getElementById('deckMode').style.display = 'none';
      document.getElementById('gridMode').style.display = 'grid';
      document.getElementById('btnModeGrid').classList.add('active');
      document.getElementById('btnModeDeck').classList.remove('active');
    }
  }

  function renderGrid() {
    const gridContainer = document.getElementById('gridMode');
    gridContainer.innerHTML = '';

    if (filteredCards.length === 0) {
      gridContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #6b7280;">لا توجد بطاقات تطابق البحث.</p>';
      return;
    }

    filteredCards.forEach((card) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'grid-card';
      cardEl.onclick = () => cardEl.classList.toggle('open');
      cardEl.innerHTML = `
        <div style="font-size:11px; font-weight:bold; color:#2563eb; margin-bottom:5px;">${card.cat}</div>
        <div class="grid-card-q">${card.q}</div>
        <div class="grid-card-a">${card.a}</div>
        <div style="font-size:10px; color:#9ca3af; margin-top:6px; text-align:left;">اضغط للإجابة 👆</div>
      `;
      gridContainer.appendChild(cardEl);
    });
  }

  // Run on load
  initApp();
</script>
