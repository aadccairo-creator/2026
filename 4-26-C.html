<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقات التحكيم المحدثة - ألعاب القوى 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 30px 15px;
            direction: rtl;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .search-box {
            margin: 20px auto 35px auto;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid #334155;
            background-color: #1e293b;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: transparent;
            height: 260px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .card-front {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
        }

        .card-back {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-num {
            font-size: 0.85rem;
            font-weight: 700;
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 20px;
            align-self: flex-start;
        }

        .card-back .card-num {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .card-text {
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 600;
            margin: auto 0;
        }

        .card-hint {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 8px;
        }

        @media (max-width: 640px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏆 بطاقات التحكيم المحدثة - ألعاب القوى 2026</h1>
        <p>50 حالة تحكيمية وقوانين محدثة مع القرارات الرسمية (اضغط على الكارت للقلب رؤية القرار)</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 ابحث في البطاقات التحكيمية..." onkeyup="filterCards()">
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- يتم إنشاء الـ 50 كارت بواسطة JavaScript -->
    </div>
</div>

        { q: "ما هي مدة الانتظار في منطقة الحجز (Penalty Zone) لسباق المشي الماراثون؟", a: "مدة الانتظار الإجبارية هي 4 دقائق (240 ثانية)." },

    const grid = document.getElementById('cardsGrid');

    function renderCards(data) {
        grid.innerHTML = '';
        data.forEach((item, index) => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.onclick = () => cardEl.classList.toggle('flipped');
            
            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <span class="card-num">كارت #${index + 1}</span>
                        <div class="card-text">${item.q}</div>
                        <div class="card-hint">🔄 اضغط لقلب الكارت ورؤية القرار</div>
                    </div>
                    <div class="card-back">
                        <span class="card-num">القرار التحكيمي الرسمي</span>
                        <div class="card-text">${item.a}</div>
                        <div class="card-hint">🔄 اضغط للعودة للسؤال</div>
                    </div>
                </div>
            `;
            grid.appendChild(cardEl);
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = cardsData.filter(c => c.q.toLowerCase().includes(query) || c.a.toLowerCase().includes(query));
        renderCards(filtered);
    }

    // Initial render
    renderCards(cardsData);
</script>

</body>
</html>
