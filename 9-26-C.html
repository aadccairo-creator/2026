<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز التنمية لألعاب القوى بالقاهرة - دليل المدير الفني للمنتخبات القومية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1B365D;
            --primary-light: #2A4B7C;
            --accent: #D9A74A;
            --bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-muted: #6C757D;
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            direction: rtl;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(27, 54, 93, 0.15);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #E2E8F0;
            opacity: 0.9;
        }

        .controls {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-box {
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            border: 2px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .btn-filter {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background-color: white;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .btn-filter:hover, .btn-filter.active {
            background-color: var(--primary);
            color: white;
        }

        .counter-badge {
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.08);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-id {
            background: var(--primary);
            color: white;
            font-weight: 700;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .card-category {
            background: #EBF3FE;
            color: var(--primary-light);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    </div>

    <div class="counter-badge" id="cardCounter">عرض 65 من أصل 65 بطاقة</div>

    <div class="cards-grid" id="cardsGrid"></div>

        let currentCategory = 'all';

        function renderCards(data) {
            const grid = document.getElementById('cardsGrid');
            const counter = document.getElementById('cardCounter');
            
            counter.innerText = `عرض ${data.length} من أصل ${cardsData.length} بطاقة`;
            
            if (data.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">لا توجد نتائج تطابق بحثك.</div>';
                return;
            }

            grid.innerHTML = data.map(card => `
                <div class="card">
                    <div>
                        <div class="card-top">
                            <span class="card-id">#${card.id}</span>
                            <span class="card-category">${card.category}</span>
                        </div>
                        <div class="card-title">${card.title}</div>
                        <div class="card-desc">${card.description}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            const filtered = cardsData.filter(card => {
                const matchesCategory = (currentCategory === 'all' || card.category === currentCategory);
                const matchesQuery = card.title.toLowerCase().includes(query) || 
                                     card.description.toLowerCase().includes(query) || 
                                     card.id.toString() === query;
                return matchesCategory && matchesQuery;
            });

            renderCards(filtered);
        }

        function setCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterCards();
        }

        // Render initially
        renderCards(cardsData);
