<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار فسيولوجيا وتكنيك الجري</title>
  <style>
    #running-quiz-root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: 850px;
      margin: 20px auto;
      padding: 25px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      color: #0f172a;
      direction: rtl;
      text-align: right;
    }
    #running-quiz-root * { box-sizing: border-box; }
    
    .rq-header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
    .rq-header h2 { font-size: 24px; color: #1e293b; margin: 0 0 8px 0; font-weight: 800; }
    .rq-header p { font-size: 14px; color: #64748b; margin: 0; }

    /* Progress & Score Bar */
    .rq-status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13.5px; font-weight: 700; color: #475569; }
    .rq-progress-bg { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
    .rq-progress-fill { height: 100%; width: 10%; background: #2563eb; transition: width 0.3s ease; }

    /* Card Box */
    .rq-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 25px; margin-bottom: 20px; transition: all 0.2s; }
    .rq-question { font-size: 18px; font-weight: 800; color: #0f172a; line-height: 1.6; margin-bottom: 20px; }

    /* Options List */
    .rq-options { display: flex; flex-direction: column; gap: 12px; }
    .rq-opt-btn {
      width: 100%; padding: 14px 18px; text-align: right; font-size: 15px; font-weight: 600;
      color: #1e293b; background: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px;
      cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
    }
    .rq-opt-btn:hover:not(:disabled) { border-color: #2563eb; background: #eff6ff; }
    .rq-opt-btn.correct { border-color: #16a34a; background: #16a34a; color: #ffffff; }
    .rq-opt-btn.wrong { border-color: #dc2626; background: #ef4444; color: #ffffff; }
    .rq-opt-btn:disabled { cursor: default; }

    /* Explanation Box */
    .rq-explanation { display: none; background: #eff6ff; border-right: 4px solid #2563eb; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 14px; color: #1e40af; line-height: 1.6; }

    /* Nav Buttons */
    .rq-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .rq-btn-next { padding: 12px 28px; font-size: 15px; font-weight: 700; color: #ffffff; background: #2563eb; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s; display: none; }
    .rq-btn-next:hover { background: #1d4ed8; }

    /* Results Screen */
    .rq-results { display: none; text-align: center; padding: 30px 10px; }
    .rq-score-circle { width: 120px; height: 120px; border-radius: 50%; background: #eff6ff; border: 4px solid #2563eb; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 20px auto; color: #1d4ed8; font-weight: 800; }
    .rq-score-num { font-size: 32px; line-height: 1; }
    .rq-score-label { font-size: 12px; margin-top: 4px; opacity: 0.8; }
    .rq-btn-restart { padding: 12px 30px; font-size: 15px; font-weight: 700; color: #ffffff; background: #16a34a; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
    .rq-btn-restart:hover { background: #15803d; }
  </style>
</head>
<body>

<div id="running-quiz-root" dir="rtl">
  
  <div class="rq-header">
    <h2>اختبار فسيولوجيا وتكنيك الجري 🏃‍♂️</h2>
    <p>اختبر معلوماتك في العوامل الفسيولوجية والميكانيكية الحيوية لسباقات التحمل والمسافات المتوسطة</p>
  </div>

  <!-- Quiz Screen -->
  <div id="rqQuizScreen">
    <div class="rq-status-bar">
      <span id="rqProgressText">السؤال 1 من 10</span>
      <span id="rqScoreText">النتيجة: 0</span>
    </div>
    <div class="rq-progress-bg">
      <div class="rq-progress-fill" id="rqProgressFill"></div>
    </div>

    <div class="rq-card">
      <div class="rq-question" id="rqQuestionText">جاري التحميل...</div>
      <div class="rq-options" id="rqOptionsGroup"></div>
      <div class="rq-explanation" id="rqExplanationBox"></div>
    </div>

    <div class="rq-footer">
      <div></div>
      <button type="button" class="rq-btn-next" id="rqBtnNext" onclick="rqNextQuestion()">السؤال التالي ➡️</button>
    </div>
  </div>

  <!-- Results Screen -->
  <div class="rq-results" id="rqResultsScreen">
    <div class="rq-score-circle">
      <div class="rq-score-num" id="rqFinalScore">0/10</div>
      <div class="rq-score-label">النتيجة النهائية</div>
    </div>
    <h3 style="font-size: 20px; color: #1e293b; margin-bottom: 10px;" id="rqResultMessage">ممتاز!</h3>
    <p style="font-size: 14px; color: #64748b;" id="rqResultDesc">لقد أتممت كافة أسئلة الاختبار بنجاح.</p>
    <button type="button" class="rq-btn-restart" onclick="rqRestartQuiz()">إعادة الاختبار 🔄</button>
  </div>

</div>

<script>
(function() {
  var quizData = [
    {
      "id": 1,
      "q": "1. ما هو الحد الأقصى لاستهلاك الأكسجين (VO2max) المتوقع لمتسابقي التحمل من النخبة؟",
      "options": [
        "أكثر من 70 مل/كجم/دقيقة",
        "أقل من 40 مل/كجم/دقيقة",
        "حوالي 50 مل/كجم/دقيقة",
        "60 مل/كجم/دقيقة كحد أقصى"
      ],
      "correct": 0,
      "exp": "يصل الحد الأقصى لاستهلاك الأكسجين لدى متسابقي التحمل من النخبة إلى أكثر من 70 مل/كجم/دقيقة."
    },
    {
      "id": 2,
      "q": "2. كم تبلغ نسبة العوامل المركزية المؤثرة في الحد الأقصى لاستهلاك الأكسجين (VO2max)؟",
      "options": [
        "25%",
        "50%",
        "75%",
        "100%"
      ],
      "correct": 2,
      "exp": "تتحدد قيمة VO2max بعوامل مركزية بنسبة 75% (سعة الانتشار الرئوي، حجم الضربة، وحمل الأكسجين) وعوامل طرفية بنسبة 25%."
    },
    {
      "id": 3,
      "q": "3. ما هي نسبة المساهمة الهوائية واللاهوائية في سباق 800 متر؟",
      "options": [
        "99% هوائي و 1% لاهوائي",
        "60 إلى 70% هوائي و 30 إلى 40% لاهوائي",
        "20% هوائي و 80% لاهوائي",
        "50% هوائي و 50% لاهوائي"
      ],
      "correct": 1,
      "exp": "في سباق 800م تكون الشدة 115-130% من VO2max وتكون المساهمة الهوائية 60-70% واللاهوائية 30-40%."
    },
    {
      "id": 4,
      "q": "4. ما التأثير البيوميكانيكي المباشر لخطأ الخطو الزائد (Overstriding) أثناء الجري؟",
      "options": [
        "زيادة سرعة الجري تلقائياً",
        "زيادة قوى الفرملة المعطلة للحركة وهدر الطاقة",
        "تحسين إقتصادية الجري",
        "تقليل خطر الإصابات العضلية"
      ],
      "correct": 1,
      "exp": "هبوط القدم بعيداً أمام مركز ثقل الجسم يؤدي لزيادة قوى الفرملة المعطلة للحركة وزيادة احتمالية الإصابة."
    },
    {
      "id": 5,
      "q": "5. كم عدد الموانع العادية والمائية التي يواجهها العداء في سباق 3000 متر موانع؟",
      "options": [
        "10 موانع عادية و 5 موانع مائية",
        "28 مانعاً عادياً و 7 موانع مائية",
        "15 مانعاً عادياً و 10 موانع مائية",
        "35 مانعاً عادياً بدون موانع مائية"
      ],
      "correct": 1,
      "exp": "يواجه متسابق الموانع 28 مانعاً عادياً و7 موانع مائية طوال مسافة سباق 3000م موانع."
    },
    {
      "id": 6,
      "q": "6. ما هي القاعدة الأولى والأساسية لسباق المشي الرياضي (القاعدة 54.2)؟",
      "options": [
        "الجري بأقصى سرعة في المنحنيات",
        "الاتصال الدائم بالأرض دون أي فقدان مرئي بالعين المجردة",
        "انثناء الركبة الأمامية أثناء الارتكاز",
        "عدم استخدام الذراعين أثناء المشي"
      ],
      "correct": 1,
      "exp": "تشترط القاعدة 54.2 الاتصال الدائم بالأرض بحيث لا يحدث أي فقدان مرئي للعين المجردة."
    },
    {
      "id": 7,
      "q": "7. ما الشرط الفني الخاص بركبة المتسابق في المشي الرياضي؟",
      "options": [
        "انثناء الركبة بزاوية 90 درجة عند الهبوط",
        "استقامة الركبة تماماً من أول ملامسة للأرض حتى الوضع العمودي",
        "انثناء الركبة فقط عند الدفع الخلفي",
        "لا توجد شروط خاصة بالركبة"
      ],
      "correct": 1,
      "exp": "يجب أن تكون الرجل الأمامية مفرودة ومستقيمة تماماً عند ملامسة الأرض وحتى الوضع العمودي المستقيم."
    },
    {
      "id": 8,
      "q": "8. كيف تُحدد حدود المنطقة الأولى للتدريب (Zone 1) في نموذج المناطق الثلاث؟",
      "options": [
        "أعلى من العتبة الثانية LT2",
        "تحت العتبة الأولى (أقل من LT1)",
        "بين العتبة الأولى والعتبة الثانية",
        "عند أقصى معدل لضربات القلب"
      ],
      "correct": 1,
      "exp": "المنطقة الأولى Zone 1 تكون بشدة أقل من العتبة الفسيولوجية الأولى (أقل من LT1) وتخصص للتدريب الخفيف والاستشفاء."
    },
    {
      "id": 9,
      "q": "9. كيف يُحسب الحمل الداخلي للجلسة التدريبية بطريقة فوستر (Foster RPE-Session)؟",
      "options": [
        "معدل الجهد الملحوظ RPE مقسوماً على مدة التمرين",
        "معدل الجهد الملحوظ RPE مضروباً في مدة التمرين بالدقائق",
        "أقصى معدل لضربات القلب ضرب المسافة",
        "مجموع المسافات المقطوعة فقط"
      ],
      "correct": 1,
      "exp": "حمل الجلسة بطريقة فوستر = درجة الجهد الملحوظ (RPE من 1 إلى 10) × مدة الجلسة بالدقائق."
    },
    {
      "id": 10,
      "q": "10. وفقاً للدراسات، ما هو المعيار الفسيولوجي الأكثر حسمًا للمفاضلة بين العدائين المتجانسين في VO2max؟",
      "options": [
        "الوزن الكلي للاعب",
        "إقتصادية الجري (Running Economy)",
        "طول القامة",
        "سعة الرئتين فقط"
      ],
      "correct": 1,
      "exp": "عندما تتشابه قيم VO2max ونسبة الاستخدام الجزئي بين المجموعات المتجانسة، تصبح إقتصادية الجري العامل الحاسم للأداء."
    }
  ];

  var currentIdx = 0;
  var score = 0;
  var answered = false;

  function initQuiz() {
    currentIdx = 0;
    score = 0;
    answered = false;
    document.getElementById('rqQuizScreen').style.display = 'block';
    document.getElementById('rqResultsScreen').style.display = 'none';
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    var q = quizData[currentIdx];
    
    document.getElementById('rqProgressText').innerText = "السؤال " + (currentIdx + 1) + " من " + quizData.length;
    document.getElementById('rqScoreText').innerText = "النتيجة: " + score;
    
    var pct = ((currentIdx + 1) / quizData.length) * 100;
    document.getElementById('rqProgressFill').style.width = pct + "%";

    document.getElementById('rqQuestionText').innerText = q.q;

    var optionsGroup = document.getElementById('rqOptionsGroup');
    optionsGroup.innerHTML = '';

    for (var i = 0; i < q.options.length; i++) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rq-opt-btn';
      btn.innerText = q.options[i];
      btn.setAttribute('data-idx', i);
      btn.onclick = (function(optIdx) {
        return function() { handleSelect(optIdx); };
      })(i);
      optionsGroup.appendChild(btn);
    }

    var expBox = document.getElementById('rqExplanationBox');
    expBox.style.display = 'none';
    expBox.innerText = '';

    document.getElementById('rqBtnNext').style.display = 'none';
  }

  function handleSelect(selectedIdx) {
    if (answered) return;
    answered = true;

    var q = quizData[currentIdx];
    var buttons = document.querySelectorAll('#rqOptionsGroup .rq-opt-btn');

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = true;
      if (i === q.correct) {
        buttons[i].classList.add('correct');
      }
    }

    if (selectedIdx === q.correct) {
      score++;
      document.getElementById('rqScoreText').innerText = "النتيجة: " + score;
    } else {
      buttons[selectedIdx].classList.add('wrong');
    }

    var expBox = document.getElementById('rqExplanationBox');
    expBox.style.display = 'block';
    expBox.innerHTML = '<strong>💡 الشرح العلمي: </strong>' + q.exp;

    var nextBtn = document.getElementById('rqBtnNext');
    nextBtn.style.display = 'inline-block';
    if (currentIdx === quizData.length - 1) {
      nextBtn.innerText = 'عرض النتيجة النهائية 🎉';
    } else {
      nextBtn.innerText = 'السؤال التالي ➡️';
    }
  }

  window.rqNextQuestion = function() {
    if (currentIdx < quizData.length - 1) {
      currentIdx++;
      renderQuestion();
    } else {
      showResults();
    }
  };

  function showResults() {
    document.getElementById('rqQuizScreen').style.display = 'none';
    document.getElementById('rqResultsScreen').style.display = 'block';

    var finalScoreEl = document.getElementById('rqFinalScore');
    finalScoreEl.innerText = score + "/" + quizData.length;

    var msgEl = document.getElementById('rqResultMessage');
    var descEl = document.getElementById('rqResultDesc');

    var pct = (score / quizData.length) * 100;
    if (pct >= 80) {
      msgEl.innerText = 'أداء أسطوري! 🏆';
      descEl.innerText = 'لديك استيعاب ممتاز للأسس الفسيولوجية والبيوميكانيكية لسباقات الجري والتحمل.';
    } else if (pct >= 50) {
      msgEl.innerText = 'أداء جيد جداً! 👏';
      descEl.innerText = 'اجتزت معظم مفاهيم الاختبار، ويمكنك مراجعة بعض النقاط البسيطة لتحقيق النتيجة الكاملة.';
    } else {
      msgEl.innerText = 'تحتاج إلى مراجعة بسيطة 📚';
      descEl.innerText = 'يمكنك إعادة قراءة دليلك الفسيولوجي وإعادة الاختبار لرفع النتيجة.';
    }
  }

  window.rqRestartQuiz = function() {
    initQuiz();
  };

  initQuiz();
})();
</script>
</body>
</html>
